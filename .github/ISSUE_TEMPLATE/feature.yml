name: Feature request
description: Propose a user-facing capability or improvement.
title: "feat: "
labels: [feature]
body:
  - type: textarea
    attributes: { label: Problem, description: What problem does this solve? }
    validations: { required: true }
  - type: textarea
    attributes: { label: Proposed solution, description: Describe the expected behavior. }
    validations: { required: true }
  - type: textarea
    attributes: { label: Acceptance criteria, description: List measurable completion criteria. }
    validations: { required: true }
